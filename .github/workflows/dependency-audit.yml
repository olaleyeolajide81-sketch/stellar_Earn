name: Dependency Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run audit weekly on Mondays at 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      
    - name: Run npm audit fix (dry-run)
      run: npm audit fix --dry-run
      
    - name: Generate audit report
      run: |
        echo "## Dependency Audit Report" > audit-report.md
        echo "### Node Version: ${{ matrix.node-version }}" >> audit-report.md
        echo "### Date: $(date)" >> audit-report.md
        echo "" >> audit-report.md
        echo "### Audit Results:" >> audit-report.md
        npm audit --json >> audit-report.json 2>&1 || true
        if [ -f audit-report.json ]; then
          echo "\`\`\`json" >> audit-report.md
          cat audit-report.json >> audit-report.md
          echo "\`\`\`" >> audit-report.md
        fi
        
    - name: Upload audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: audit-report-${{ matrix.node-version }}
        path: |
          audit-report.md
          audit-report.json
        
    - name: Check for high vulnerabilities
      run: |
        if npm audit --audit-level=high | grep -q "high"; then
          echo "❌ High severity vulnerabilities found!"
          exit 1
        else
          echo "✅ No high severity vulnerabilities found"
        fi
